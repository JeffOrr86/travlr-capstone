<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Trip Listing</h2>
  <!-- Add Trip button only appears for SuperAdmin -->
  <button *ngIf="isSuperAdmin()" routerLink="/add" class="btn btn-info text-white">
    Add Trip
  </button>
</div>

<div *ngIf="message" class="alert alert-warning">
  {{ message }}
</div>

<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let trip of trips">
    <app-trip-card [trip]="trip"></app-trip-card>
  </div>
</div>
