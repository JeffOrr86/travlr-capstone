<div class="card h-100" *ngIf="trip">
  <img [src]="'assets/images/' + trip.image" [alt]="trip.name" class="card-img-top">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ trip.name }}</h5>
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>
    <p class="card-text">{{ trip.length }} | {{ trip.start | date:'mediumDate' }}</p>
    <p class="card-text font-weight-bold">${{ trip.perPerson }} per person</p>
    <div class="card-text flex-grow-1" [innerHTML]="trip.description"></div>
    <!-- Only show the Edit button if an admin is logged in -->
    <div class="mt-3" *ngIf="isLoggedIn()">
      <button (click)="editTrip(trip)" class="btn btn-primary btn-sm">Edit</button>
    </div>
  </div>
</div>
